<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>تحدي طريق المزود • صوم الميلاد المجيد</title>
    <meta
      name="description"
      content="تطبيق تحدي طريق المزود لصوم الميلاد المجيد لاجتماع أبو سيفين للشباب الخريجين بالشارقة لمتابعة المهام الروحية اليومية والأسبوعية واعتماد النقاط."

    <!-- PWA Theme & Manifest -->

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Apple iOS Standalone PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="تحدي طريق المزود" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Arabic Fonts (Google Fonts + bundled local fallback in index.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body class="bg-[#FAF6EE] text-[#13262F] antialiased selection:bg-[#FFF2D6] selection:text-[#13313D]">
